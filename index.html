<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>PTU Certificate</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f2f2;
    }

    .viewer {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .fallback {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      text-align: center;
      font: 14px Arial, sans-serif;
    }

    .fallback a {
      color: #075bc8;
    }
  </style>
</head>

<body>
  <div class="viewer">
    <iframe
      src="./BAA%20%28E%29%20%281%29%20%281%29.pdf#view=FitH"
      title="PTU Certificate">
    </iframe>
  </div>

  <div class="fallback">
    <a href="./BAA%20%28E%29%20%281%29%20%281%29.pdf">
      Open PDF directly
    </a>
  </div>
</body>
</html>
