<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PTU Certificate</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f2f2f2;
    }

    body {
      overflow: auto;
    }

    .pdf-container {
      width: 100%;
      min-height: 100vh;
      padding: 0;
      margin: 0 auto;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      border: none;
      background: white;
    }

    @media (max-width: 600px) {
      .pdf-container {
        width: 100%;
      }

      iframe {
        width: 100%;
        height: 100dvh;
        min-height: 500px;
      }
    }
  </style>
</head>

<body>
  <div class="pdf-container">
    <iframe
      src="./PTU.pdf#view=FitH"
      title="PTU Certificate">
    </iframe>
  </div>
</body>
</html>
